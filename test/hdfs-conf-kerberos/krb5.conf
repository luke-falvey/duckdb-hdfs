# Host-side Kerberos client config for the test realm (KRB5_CONFIG).
[libdefaults]
    default_realm = EXAMPLE.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false
    # Don't append the DNS search domain to dotless names like "localhost"
    # (MIT krb5 1.18+ does by default), which would ask for nn/localhost.<domain>.
    qualify_shortname = ""
    udp_preference_limit = 1
    ticket_lifetime = 24h
    forwardable = true
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

[realms]
    EXAMPLE.TEST = {
        kdc = localhost:18888
    }
