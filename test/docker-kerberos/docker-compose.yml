# Kerberos-secured HDFS + MIT KDC for the Kerberos integration tests.
# Brought up/down via test/scripts/run_kerberos_tests.sh.
services:
  kdc:
    build: ./kdc
    image: duckdb-hdfs-kdc:latest
    container_name: duckdb-hdfs-kdc
    ports:
      - "18888:88"     # KDC (TCP; the client config forces TCP)
    volumes:
      - keytabs:/keytabs
  hdfs:
    build: .
    image: duckdb-hdfs-kerberos:latest
    container_name: duckdb-hdfs-kerberos
    depends_on:
      - kdc
    ports:
      - "19000:19000"  # NameNode RPC
      - "19866:19866"  # DataNode data transfer
    volumes:
      - keytabs:/keytabs:ro
volumes:
  keytabs:
