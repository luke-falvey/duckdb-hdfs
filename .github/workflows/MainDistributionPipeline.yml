#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      ci_tools_version: v2.0-cyanoptera
      extension_name: hdfs
      # DuckDB itself is built from the commit pinned by the duckdb submodule.
      # The native HDFS client (libhdfs3, built by vcpkg from vcpkg_ports/)
      # needs POSIX sockets and doesn't support Windows or WebAssembly, so
      # restrict to the Linux/macOS desktop+server platforms.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      ci_tools_version: v2.0-cyanoptera
      extension_name: hdfs
      # clang-tidy is left out: it configures the full build, which needs the
      # vcpkg dependencies this workflow doesn't install. Run `make tidy-check`
      # locally (with VCPKG_TOOLCHAIN_PATH set) instead.
      format_checks: "format"
